# netlify.toml — Netlify configuration for UniClass
#
# 1. Copy this file to your project root
# 2. Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in the Netlify UI
#    (Site settings → Build & deploy → Environment → Environment variables)
#    OR they are already set below as a convenience for the shared project.

[build]
  publish = "dist"
  command = "npm run build"

# Vite environment variables — these are inlined at build time
# The anon key is public (client-side), so it's safe to include here.
[build.environment]
  VITE_SUPABASE_URL = "https://rqvrndkhjrammmsdrinz.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxdnJuZGtoanJhbW1tc2RyaW56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MjgwNTIsImV4cCI6MjEwMTIwNDA1Mn0.dvPXRlNPSykECcVt0ogpEmEyFWnxK3sIEz6cps717fA"

