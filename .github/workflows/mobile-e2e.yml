name: Mobile end-to-end checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
      TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
      TEST_E2E_PASSWORD: ${{ secrets.TEST_E2E_PASSWORD }}
      TEST_TEACHER_PASSWORD: ${{ secrets.TEST_E2E_PASSWORD }}
      TEST_STUDENT_PASSWORD: ${{ secrets.TEST_E2E_PASSWORD }}
      TEST_E2E_SEED: '1'
      # These are dedicated test accounts configured in this repository's
      # secrets. The seed script still refuses arbitrary accounts unless this
      # explicit CI-only flag is present.
      ALLOW_REAL_TEST_ACCOUNTS: '1'
      TEST_E2E_STRICT: '1'
      TEST_STUDENT_HAS_MULTIPLE_CLASSES: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify test configuration
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY TEST_SUPABASE_SERVICE_ROLE_KEY TEST_TEACHER_EMAIL TEST_STUDENT_EMAIL TEST_E2E_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:seed
      - run: npm run test:e2e
